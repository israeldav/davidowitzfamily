<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Family Branch Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oxygen:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --panel-soft: #f9fbff;
      --border: #d6deeb;
      --line: #f0579c;
      --text: #1f2937;
      --muted: #6b7280;
      --link: #1d4ed8;
      --accent: #ffbd3a;
      --accent-text: #1f3a8a;
      --shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
      --tree-card-width: 210px;
      --tree-x-gap: 18px;
      --tree-y-gap: 42px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      font-family: "Oxygen", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(255, 189, 58, 0.12), transparent 26%),
        linear-gradient(180deg, #fafcff 0%, #eef3f9 100%);
    }

    .page {
      max-width: 1400px;
      margin: 0 auto;
      padding: 18px 16px 40px;
    }

    .branch-chooser,
    .viewer-panel {
      border: 1px solid var(--border);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .branch-chooser {
      margin-bottom: 18px;
    }

    .chooser-head,
    .viewer-head {
      padding: 18px 18px 14px;
      border-bottom: 1px solid #edf2f7;
      background: linear-gradient(180deg, #ffffff, #fbfdff);
    }

    .chooser-head h2,
    .viewer-head h2 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
    }

    .chooser-head p,
    .viewer-head p {
      margin: 6px 0 0;
      font-size: 13px;
      line-height: 1.45;
      color: var(--muted);
    }

    .branch-search {
      width: 100%;
      margin-top: 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 11px 14px;
      font: inherit;
    }

    .branch-list {
      display: flex;
      gap: 10px;
      padding: 14px;
      overflow: auto;
    }

    .branch-button {
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--panel);
      color: inherit;
      text-align: left;
      padding: 14px 14px 12px;
      cursor: pointer;
      transition: border-color 120ms ease, transform 120ms ease, box-shadow 120ms ease;
      min-width: 240px;
      flex: 0 0 auto;
    }

    .branch-button:hover {
      transform: translateY(-1px);
      border-color: #f4a5c8;
      box-shadow: 0 10px 22px rgba(240, 87, 156, 0.09);
    }

    .branch-button.active {
      border-color: #f0579c;
      box-shadow: inset 0 0 0 1px rgba(240, 87, 156, 0.16);
      background: linear-gradient(180deg, #ffffff, #fff8fc);
    }

    .branch-button-title {
      font-size: 18px;
      line-height: 1.25;
      font-weight: 700;
      color: #1e3f95;
    }

    .branch-button-meta {
      margin-top: 6px;
      font-size: 13px;
      line-height: 1.4;
      color: var(--muted);
    }

    .viewer-head {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    .viewer-tools {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
      align-items: center;
    }

    .viewer-tools button {
      border: 1px solid var(--border);
      border-radius: 999px;
      background: #ffffff;
      color: inherit;
      padding: 10px 14px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .viewer-tools button:hover {
      border-color: #f4a5c8;
      color: #c72e7a;
    }

    .viewer-tools button.active {
      border-color: #f0579c;
      color: #c72e7a;
      background: #fff8fc;
    }

    .tree-wrap {
      padding: 18px 18px 26px;
      overflow: auto;
      background-image: radial-gradient(#d8dee9 1px, transparent 1px);
      background-size: 18px 18px;
    }

    .tree-stage {
      width: max-content;
      min-width: 100%;
      transform-origin: top left;
      transition: transform 140ms ease;
    }

    .tree {
      display: inline-block;
      padding: 8px 10px 14px;
    }

    .tree,
    .tree ul {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .tree ul {
      position: relative;
      display: flex;
      justify-content: center;
      padding-top: var(--tree-y-gap);
    }

    .tree li {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: calc(var(--tree-card-width) + 40px);
      padding: 0 calc(var(--tree-x-gap) / 2);
      text-align: center;
    }

    .tree ul::before {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      height: 24px;
      border-left: 3px solid var(--line);
      transform: translateX(-1.5px);
    }

    .tree li::before,
    .tree li::after {
      content: "";
      position: absolute;
      top: 0;
      width: 50%;
      height: 24px;
      border-top: 3px solid var(--line);
    }

    .tree li::before {
      right: 50%;
    }

    .tree li::after {
      left: 50%;
      border-left: 3px solid var(--line);
    }

    .tree li:only-child::before,
    .tree li:only-child::after {
      display: none;
    }

    .tree li:first-child::before,
    .tree li:last-child::after {
      border-top: 0;
    }

    .tree li:last-child::before {
      border-right: 3px solid var(--line);
      border-radius: 0 10px 0 0;
    }

    .tree li:first-child::after {
      border-radius: 10px 0 0 0;
    }

    .person-group {
      display: flex;
      align-items: stretch;
      gap: 18px;
      position: relative;
      z-index: 1;
    }

    .person-group.has-spouse::after {
      content: "";
      position: absolute;
      top: 50%;
      left: calc(50% - 9px);
      width: 18px;
      border-top: 3px solid var(--line);
      transform: translateY(-1.5px);
    }

    .person-group.synthetic-root {
      display: none;
    }

    .node-card {
      width: var(--tree-card-width);
      padding: 14px 14px 12px;
      border-radius: 4px;
      background: var(--accent);
      color: var(--accent-text);
      box-shadow: 6px 7px 0 rgba(32, 47, 70, 0.08);
      border: 2px solid rgba(17, 24, 39, 0.08);
      position: relative;
      z-index: 1;
      cursor: pointer;
      transition: transform 120ms ease, box-shadow 120ms ease;
    }

    .node-card:hover {
      transform: translateY(-2px);
      box-shadow: 8px 10px 0 rgba(32, 47, 70, 0.11);
    }

    .node-card.linked {
      background: #d7ecff;
    }

    .node-card.deceased {
      background: #ffe2e6;
      color: #8b2f3b;
    }

    .node-name {
      font-size: 21px;
      line-height: 1.18;
      font-weight: 700;
      letter-spacing: 0.02em;
      padding-right: 28px;
    }

    .node-info {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 26px;
      height: 26px;
      border-radius: 999px;
      border: 1px solid rgba(17, 24, 39, 0.16);
      background: rgba(255, 255, 255, 0.72);
      color: inherit;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 15px;
      font-weight: 700;
    }

    .node-info:hover {
      background: #ffffff;
    }

    .node-meta {
      margin-top: 6px;
      font-size: 13px;
      line-height: 1.35;
    }

    .node-meta span + span::before {
      content: " | ";
    }

    .node-flag {
      margin-top: 8px;
      font-size: 20px;
      line-height: 1;
    }

    .empty {
      padding: 48px 18px;
      text-align: center;
      color: var(--muted);
    }

    @media (max-width: 900px) {
      .node-name {
        font-size: 18px;
      }

      .person-group {
        gap: 12px;
      }

      .tree li {
        min-width: calc(var(--tree-card-width) + 18px);
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <section class="branch-chooser">
      <div class="chooser-head">
        <h2>Major Roots</h2>
        <p>Choose a family root or couple, then click any card in the tree to drill into that person’s descendants.</p>
        <input id="branch-search" class="branch-search" type="search" placeholder="Find a branch">
      </div>
      <div id="branch-list" class="branch-list"></div>
    </section>

    <section class="viewer-panel">
        <div class="viewer-head">
          <div>
            <h2 id="viewer-title">Select a branch</h2>
            <p id="viewer-description">Choose one of the major roots above to focus the tree.</p>
          </div>
          <div class="viewer-tools">
            <button id="view-all-button" type="button">View All</button>
            <button id="back-out" type="button" hidden>Back</button>
            <button id="zoom-out" type="button">-</button>
            <button id="zoom-reset" type="button">100%</button>
            <button id="zoom-in" type="button">+</button>
          </div>
        </div>
        <div class="tree-wrap">
          <div id="tree-stage" class="tree-stage">
            <div id="tree-root"></div>
          </div>
        </div>
      </section>
  </div>

  <script src="../family-data.js"></script>
  <script>
    var familyNodes = window.familyData.nodes;
    var majorRoots = window.familyData.majorRoots;
    var profileMap = window.familyData.profiles || {};
    var nodesById = new Map();
    var childrenByParent = new Map();
    var branchListEl = document.getElementById('branch-list');
    var branchSearchEl = document.getElementById('branch-search');
    var viewerTitleEl = document.getElementById('viewer-title');
    var viewerDescriptionEl = document.getElementById('viewer-description');
    var viewAllButtonEl = document.getElementById('view-all-button');
    var backOutEl = document.getElementById('back-out');
    var treeRootEl = document.getElementById('tree-root');
    var treeStageEl = document.getElementById('tree-stage');
    var zoomResetEl = document.getElementById('zoom-reset');
    var currentZoom = 1;
    var activeBranchId = 'view-all';
    var currentRootId = null;
    var focusHistory = [];

    var allBranch = {
      id: 'view-all',
      label: 'View All',
      people: [51, 52],
      description: 'Show the full connected family tree',
    };

    familyNodes.forEach(function (node) {
      nodesById.set(node.id, node);

      if (node.fid != null) {
        if (!childrenByParent.has(node.fid)) {
          childrenByParent.set(node.fid, []);
        }
        childrenByParent.get(node.fid).push(node.id);
      }

      if (node.mid != null) {
        if (!childrenByParent.has(node.mid)) {
          childrenByParent.set(node.mid, []);
        }
        childrenByParent.get(node.mid).push(node.id);
      }
    });

    function uniqueChildrenForPeople(ids) {
      var found = new Set();
      ids.forEach(function (id) {
        (childrenByParent.get(id) || []).forEach(function (childId) {
          found.add(childId);
        });
      });
      return Array.from(found);
    }

    function spouseIds(node) {
      return Array.isArray(node.pids) ? node.pids : [];
    }

    function hasParents(nodeId) {
      var node = nodesById.get(nodeId);
      return !!(node && (node.fid != null || node.mid != null));
    }

    function inferredPartnerIds(nodeId) {
      var node = nodesById.get(nodeId);
      if (!node) {
        return [];
      }

      var found = new Set(spouseIds(node));
      familyNodes.forEach(function (child) {
        if (child.fid === nodeId && child.mid != null) {
          found.add(child.mid);
        }
        if (child.mid === nodeId && child.fid != null) {
          found.add(child.fid);
        }
      });

      found.delete(nodeId);
      return Array.from(found);
    }

    function rootFamilies() {
      var candidates = familyNodes.filter(function (node) {
        return node.fid == null && node.mid == null;
      });
      var candidateIds = new Set(candidates.map(function (node) { return node.id; }));
      var excluded = new Set();

      candidates.forEach(function (node) {
        var partners = inferredPartnerIds(node.id);
        if (partners.some(function (partnerId) { return hasParents(partnerId); })) {
          excluded.add(node.id);
        }
      });

      var seen = new Set();
      var families = [];

      candidates.forEach(function (node) {
        if (excluded.has(node.id) || seen.has(node.id)) {
          return;
        }

        var partners = inferredPartnerIds(node.id).filter(function (partnerId) {
          return candidateIds.has(partnerId) && !excluded.has(partnerId);
        });

        var family = [node.id].concat(partners).sort(function (a, b) { return a - b; });
        family.forEach(function (id) { seen.add(id); });
        families.push(family);
      });

      return families;
    }

    function formatName(node) {
      return node ? node.name : 'Unknown';
    }

    function personHref(node) {
      if (!node || !profileMap[node.id]) {
        return '';
      }
      return '../' + profileMap[node.id];
    }

    function personCardData(personId) {
      var person = nodesById.get(personId);
      if (!person) {
        return {
          id: personId,
          name: 'Unknown',
          meta: [],
          deceased: false,
          linked: false,
          flag: '',
          href: '',
        };
      }

      var meta = [];
      if (person.born) {
        meta.push('b. ' + person.born);
      }
      if (person.married) {
        meta.push('m. ' + person.married);
      }
      if (person.died) {
        meta.push('d. ' + person.died);
      }

      var flag = '';
      if (/Australia/.test(person.name)) {
        flag = '🇦🇺';
      } else if (/Israel/.test(person.name)) {
        flag = '🇮🇱';
      } else if (/Staten Island/.test(person.name)) {
        flag = '🇺🇸';
      }

      return {
        id: person.id,
        name: formatName(person),
        meta: meta,
        deceased: !!person.died,
        linked: spouseIds(person).length > 1,
        flag: flag,
        href: personHref(person),
      };
    }

    function buildPersonTree(personId, partnerHint, seen) {
      var person = nodesById.get(personId);
      if (!person) {
        return null;
      }

      var partnerIds = spouseIds(person).slice();
      if (partnerHint != null && partnerIds.indexOf(partnerHint) === -1) {
        partnerIds.unshift(partnerHint);
      }
      if (partnerHint != null) {
        partnerIds = [partnerHint].concat(partnerIds.filter(function (id) {
          return id !== partnerHint;
        }));
      }

      var dedupeKey = [personId].concat(partnerIds.slice().sort(function (a, b) { return a - b; })).join('-');
      if (seen.has(dedupeKey)) {
        return null;
      }
      seen.add(dedupeKey);

      var familyIds = [personId].concat(partnerIds);
      var childIds = uniqueChildrenForPeople(familyIds);
      var children = childIds.map(function (childId) {
        var child = nodesById.get(childId);
        if (!child) {
          return null;
        }
        return buildPersonTree(child.id, spouseIds(child)[0] || null, seen);
      }).filter(Boolean);

      return {
        key: dedupeKey,
        personId: personId,
        partnerIds: partnerIds,
        children: children,
      };
    }

    function findTreeNode(treeNode, key) {
      if (!treeNode) {
        return null;
      }
      if (treeNode.key === key) {
        return treeNode;
      }
      for (var i = 0; i < (treeNode.children || []).length; i++) {
        var found = findTreeNode(treeNode.children[i], key);
        if (found) {
          return found;
        }
      }
      return null;
    }

    function focusTreeNode(personId) {
      if (!personId) {
        return;
      }
      focusHistory.push(currentRootId);
      currentRootId = personId;
      updateViewer();
    }

    function renderCard(personId) {
      var cardData = personCardData(personId);
      var card = document.createElement('div');
      card.className = 'node-card' +
        (cardData.linked ? ' linked' : '') +
        (cardData.deceased ? ' deceased' : '');
      card.addEventListener('click', function () {
        focusTreeNode(personId);
      });

      var name = document.createElement('div');
      name.className = 'node-name';
      name.textContent = cardData.name;
      card.appendChild(name);

      if (cardData.href) {
        var info = document.createElement('a');
        info.className = 'node-info';
        info.href = cardData.href;
        info.target = '_blank';
        info.rel = 'noopener noreferrer';
        info.textContent = 'i';
        info.title = 'Open detail page';
        info.setAttribute('aria-label', 'Open detail page');
        info.addEventListener('click', function (event) {
          event.stopPropagation();
        });
        card.appendChild(info);
      }

      if (cardData.meta.length) {
        var meta = document.createElement('div');
        meta.className = 'node-meta';
        meta.innerHTML = cardData.meta.map(function (item) {
          return '<span>' + item + '</span>';
        }).join('');
        card.appendChild(meta);
      }

      if (cardData.flag) {
        var flag = document.createElement('div');
        flag.className = 'node-flag';
        flag.textContent = cardData.flag;
        card.appendChild(flag);
      }

      return card;
    }

    function renderNode(treeNode) {
      var li = document.createElement('li');
      var group = document.createElement('div');
      group.className = 'person-group' + (treeNode.partnerIds.length ? ' has-spouse' : '') + (treeNode.synthetic ? ' synthetic-root' : '');

      if (!treeNode.synthetic) {
        group.appendChild(renderCard(treeNode.personId));
        treeNode.partnerIds.forEach(function (partnerId) {
          group.appendChild(renderCard(partnerId));
        });
      }

      li.appendChild(group);

      if (treeNode.children && treeNode.children.length) {
        var ul = document.createElement('ul');
        treeNode.children.forEach(function (child) {
          ul.appendChild(renderNode(child));
        });
        li.appendChild(ul);
      }

      return li;
    }

    function renderTree(branch) {
      treeRootEl.innerHTML = '';

      if (!branch) {
        treeRootEl.innerHTML = '<div class="empty">No branch selected.</div>';
        return;
      }

      var roots;
      if (branch.id === 'view-all' && currentRootId == null) {
        roots = [{
          key: 'synthetic-root',
          synthetic: true,
          personId: null,
          partnerIds: [],
          children: rootFamilies().map(function (family) {
            return buildPersonTree(family[0], family[1] || null, new Set());
          }).filter(Boolean),
        }];
      } else {
        var branchRootId = currentRootId != null ? currentRootId : branch.people[0];
        var branchPartnerId = branch.people[1] || inferredPartnerIds(branchRootId)[0] || null;
        roots = [buildPersonTree(branchRootId, branchPartnerId, new Set())].filter(Boolean);
      }

      if (!roots.length) {
        treeRootEl.innerHTML = '<div class="empty">This branch could not be rendered.</div>';
        return;
      }

      roots.forEach(function (rootTree) {
        var tree = document.createElement('ul');
        tree.className = 'tree';
        tree.appendChild(renderNode(rootTree));
        treeRootEl.appendChild(tree);
      });
      applyZoom();
    }

    function renderBranchList(filterText) {
      var filter = (filterText || '').trim().toLowerCase();
      branchListEl.innerHTML = '';

      [allBranch].concat(majorRoots).forEach(function (branch) {
        var haystack = (branch.label + ' ' + branch.description).toLowerCase();
        if (filter && haystack.indexOf(filter) === -1) {
          return;
        }

        var button = document.createElement('button');
        button.type = 'button';
        button.className = 'branch-button' + (branch.id === activeBranchId ? ' active' : '');
        button.addEventListener('click', function () {
          activeBranchId = branch.id;
          currentRootId = branch.id === 'view-all' ? null : branch.people[0];
          focusHistory = [];
          updateViewer();
        });

        var title = document.createElement('div');
        title.className = 'branch-button-title';
        title.textContent = branch.label;

        var meta = document.createElement('div');
        meta.className = 'branch-button-meta';
        meta.textContent = branch.description;

        button.appendChild(title);
        button.appendChild(meta);
        branchListEl.appendChild(button);
      });
    }

    function activeBranch() {
      return [allBranch].concat(majorRoots).find(function (branch) {
        return branch.id === activeBranchId;
      }) || null;
    }

    function updateViewer() {
      var branch = activeBranch();
      renderBranchList(branchSearchEl.value);
      viewAllButtonEl.classList.toggle('active', activeBranchId === 'view-all');

      if (!branch) {
        viewerTitleEl.textContent = 'Select a branch';
        viewerDescriptionEl.textContent = 'Choose one of the major roots above to focus the tree.';
        backOutEl.hidden = true;
        renderTree(null);
        return;
      }

      var rootData = personCardData(currentRootId != null ? currentRootId : branch.people[0]);
      if (branch.id === 'view-all' && currentRootId == null) {
        viewerTitleEl.textContent = branch.label;
        viewerDescriptionEl.textContent = 'Showing the full connected family tree from all top ancestor families. Click any person card to focus on that subtree.';
        backOutEl.hidden = true;
      } else if (currentRootId != null && currentRootId !== branch.people[0]) {
        viewerTitleEl.textContent = rootData.name;
        viewerDescriptionEl.textContent = 'Showing this person, their spouse connections, and descendants inside the ' + branch.label + ' branch.';
        backOutEl.hidden = false;
      } else {
        viewerTitleEl.textContent = branch.label;
        viewerDescriptionEl.textContent = branch.description + '. Click any person card to focus on that subtree.';
        backOutEl.hidden = true;
      }
      renderTree(branch);
    }

    function applyZoom() {
      treeStageEl.style.transform = 'scale(' + currentZoom + ')';
      zoomResetEl.textContent = Math.round(currentZoom * 100) + '%';
    }

    document.getElementById('zoom-in').addEventListener('click', function () {
      currentZoom = Math.min(1.6, currentZoom + 0.1);
      applyZoom();
    });

    document.getElementById('zoom-out').addEventListener('click', function () {
      currentZoom = Math.max(0.45, currentZoom - 0.1);
      applyZoom();
    });

    zoomResetEl.addEventListener('click', function () {
      currentZoom = 1;
      applyZoom();
    });

    viewAllButtonEl.addEventListener('click', function () {
      activeBranchId = 'view-all';
      currentRootId = null;
      focusHistory = [];
      updateViewer();
    });

    backOutEl.addEventListener('click', function () {
      currentRootId = focusHistory.length
        ? focusHistory.pop()
        : (activeBranch().id === 'view-all' ? null : activeBranch().people[0]);
      updateViewer();
    });

    currentRootId = null;
    branchSearchEl.addEventListener('input', function () {
      renderBranchList(branchSearchEl.value);
    });

    updateViewer();
  </script>
</body>
</html>
