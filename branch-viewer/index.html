<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Family Branch Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oxygen:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --panel-soft: #f9fbff;
      --border: #d6deeb;
      --line: #f0579c;
      --text: #1f2937;
      --muted: #6b7280;
      --link: #1d4ed8;
      --accent: #ffbd3a;
      --accent-text: #1f3a8a;
      --shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
      --tree-card-width: 220px;
      --tree-x-gap: 18px;
      --tree-y-gap: 42px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      font-family: "Oxygen", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(255, 189, 58, 0.12), transparent 26%),
        linear-gradient(180deg, #fafcff 0%, #eef3f9 100%);
    }

    .page {
      max-width: 1400px;
      margin: 0 auto;
      padding: 18px 16px 40px;
    }

    .branch-chooser,
    .viewer-panel {
      border: 1px solid var(--border);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .branch-chooser {
      margin-bottom: 18px;
    }

    .chooser-head,
    .viewer-head {
      padding: 18px 18px 14px;
      border-bottom: 1px solid #edf2f7;
      background: linear-gradient(180deg, #ffffff, #fbfdff);
    }

    .chooser-head h2,
    .viewer-head h2 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
    }

    .chooser-head p,
    .viewer-head p {
      margin: 6px 0 0;
      font-size: 13px;
      line-height: 1.45;
      color: var(--muted);
    }

    .branch-search {
      width: 100%;
      margin-top: 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 11px 14px;
      font: inherit;
    }

    .branch-list {
      display: flex;
      gap: 10px;
      padding: 14px;
      overflow: auto;
    }

    .branch-button {
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--panel);
      color: inherit;
      text-align: left;
      padding: 14px 14px 12px;
      cursor: pointer;
      transition: border-color 120ms ease, transform 120ms ease, box-shadow 120ms ease;
      min-width: 240px;
      flex: 0 0 auto;
    }

    .branch-button:hover {
      transform: translateY(-1px);
      border-color: #f4a5c8;
      box-shadow: 0 10px 22px rgba(240, 87, 156, 0.09);
    }

    .branch-button.active {
      border-color: #f0579c;
      box-shadow: inset 0 0 0 1px rgba(240, 87, 156, 0.16);
      background: linear-gradient(180deg, #ffffff, #fff8fc);
    }

    .branch-button-title {
      font-size: 18px;
      line-height: 1.25;
      font-weight: 700;
      color: #1e3f95;
    }

    .branch-button-meta {
      margin-top: 6px;
      font-size: 13px;
      line-height: 1.4;
      color: var(--muted);
    }

    .viewer-head {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    .viewer-tools {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
      align-items: center;
    }

    .viewer-tools button {
      border: 1px solid var(--border);
      border-radius: 999px;
      background: #ffffff;
      color: inherit;
      padding: 10px 14px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .viewer-tools button:hover {
      border-color: #f4a5c8;
      color: #c72e7a;
    }

    .tree-wrap {
      padding: 18px 18px 26px;
      overflow: auto;
      background-image: radial-gradient(#d8dee9 1px, transparent 1px);
      background-size: 18px 18px;
    }

    .tree-stage {
      width: max-content;
      min-width: 100%;
      transform-origin: top left;
      transition: transform 140ms ease;
    }

    .tree {
      display: inline-block;
      padding: 8px 10px 14px;
    }

    .tree,
    .tree ul {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .tree ul {
      position: relative;
      display: flex;
      justify-content: center;
      padding-top: var(--tree-y-gap);
    }

    .tree li {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: var(--tree-card-width);
      padding: 0 calc(var(--tree-x-gap) / 2);
      text-align: center;
    }

    .tree ul::before {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      height: 24px;
      border-left: 3px solid var(--line);
      transform: translateX(-1.5px);
    }

    .tree li::before,
    .tree li::after {
      content: "";
      position: absolute;
      top: 0;
      width: 50%;
      height: 24px;
      border-top: 3px solid var(--line);
    }

    .tree li::before {
      right: 50%;
    }

    .tree li::after {
      left: 50%;
      border-left: 3px solid var(--line);
    }

    .tree li:only-child::before,
    .tree li:only-child::after {
      display: none;
    }

    .tree li:first-child::before,
    .tree li:last-child::after {
      border-top: 0;
    }

    .tree li:last-child::before {
      border-right: 3px solid var(--line);
      border-radius: 0 10px 0 0;
    }

    .tree li:first-child::after {
      border-radius: 10px 0 0 0;
    }

    .node-card {
      width: var(--tree-card-width);
      padding: 14px 14px 12px;
      border-radius: 4px;
      background: var(--accent);
      color: var(--accent-text);
      box-shadow: 6px 7px 0 rgba(32, 47, 70, 0.08);
      border: 2px solid rgba(17, 24, 39, 0.08);
      position: relative;
      z-index: 1;
      cursor: pointer;
      transition: transform 120ms ease, box-shadow 120ms ease;
    }

    .node-card:hover {
      transform: translateY(-2px);
      box-shadow: 8px 10px 0 rgba(32, 47, 70, 0.11);
    }

    .node-card.linked {
      background: #d7ecff;
    }

    .node-card.deceased {
      background: #ffe2e6;
      color: #8b2f3b;
    }

    .node-name {
      font-size: 21px;
      line-height: 1.18;
      font-weight: 700;
      letter-spacing: 0.02em;
      padding-right: 28px;
    }

    .node-info {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 26px;
      height: 26px;
      border-radius: 999px;
      border: 1px solid rgba(17, 24, 39, 0.16);
      background: rgba(255, 255, 255, 0.72);
      color: inherit;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 15px;
      font-weight: 700;
    }

    .node-info:hover {
      background: #ffffff;
    }

    .node-meta {
      margin-top: 6px;
      font-size: 13px;
      line-height: 1.35;
    }

    .node-meta span + span::before {
      content: " | ";
    }

    .node-flag {
      margin-top: 8px;
      font-size: 20px;
      line-height: 1;
    }

    .empty {
      padding: 48px 18px;
      text-align: center;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="page">
    <section class="branch-chooser">
      <div class="chooser-head">
        <h2>Major Roots</h2>
        <p>Choose a family root or couple, then click any card in the tree to drill into that person’s descendants.</p>
        <input id="branch-search" class="branch-search" type="search" placeholder="Find a branch">
      </div>
      <div id="branch-list" class="branch-list"></div>
    </section>

    <section class="viewer-panel">
        <div class="viewer-head">
          <div>
            <h2 id="viewer-title">Select a branch</h2>
            <p id="viewer-description">Choose one of the major roots on the left to focus the tree.</p>
          </div>
          <div class="viewer-tools">
            <button id="back-out" type="button" hidden>Back Out</button>
            <button id="zoom-out" type="button">-</button>
            <button id="zoom-reset" type="button">100%</button>
            <button id="zoom-in" type="button">+</button>
          </div>
        </div>
        <div class="tree-wrap">
          <div id="tree-stage" class="tree-stage">
            <div id="tree-root"></div>
          </div>
        </div>
      </section>
  </div>

  <script src="../family-data.js"></script>
  <script>
    var familyNodes = window.familyData.nodes;
    var majorRoots = window.familyData.majorRoots;
    var profileMap = window.familyData.profiles || {};
    var nodesById = new Map();
    var childrenByParent = new Map();
    var branchListEl = document.getElementById('branch-list');
    var branchSearchEl = document.getElementById('branch-search');
    var viewerTitleEl = document.getElementById('viewer-title');
    var viewerDescriptionEl = document.getElementById('viewer-description');
    var backOutEl = document.getElementById('back-out');
    var treeRootEl = document.getElementById('tree-root');
    var treeStageEl = document.getElementById('tree-stage');
    var zoomResetEl = document.getElementById('zoom-reset');
    var currentZoom = 1;
    var activeBranchId = 'view-all';
    var currentFocusKey = null;
    var focusHistory = [];

    var allBranch = {
      id: 'view-all',
      label: 'View All',
      people: [1, 2, 49, 50, 51, 52],
      description: 'Show the full top-level family tree',
      useAllRoots: true,
    };

    familyNodes.forEach(function (node) {
      nodesById.set(node.id, node);

      if (node.fid != null) {
        if (!childrenByParent.has(node.fid)) {
          childrenByParent.set(node.fid, []);
        }
        childrenByParent.get(node.fid).push(node.id);
      }

      if (node.mid != null) {
        if (!childrenByParent.has(node.mid)) {
          childrenByParent.set(node.mid, []);
        }
        childrenByParent.get(node.mid).push(node.id);
      }
    });

    function uniqueChildrenForPeople(ids) {
      var found = new Set();
      ids.forEach(function (id) {
        (childrenByParent.get(id) || []).forEach(function (childId) {
          found.add(childId);
        });
      });
      return Array.from(found);
    }

    function spouseIds(node) {
      return Array.isArray(node.pids) ? node.pids : [];
    }

    function formatName(node) {
      return node ? node.name : 'Unknown';
    }

    function personHref(node) {
      if (!node || !profileMap[node.id]) {
        return '';
      }
      return '../' + profileMap[node.id];
    }

    function nodeCardData(personIds) {
      var people = personIds
        .map(function (id) { return nodesById.get(id); })
        .filter(Boolean);

      var primary = people[0];
      var isLinked = people.some(function (person) {
        return (person.pids || []).some(function (pid) {
          return personIds.indexOf(pid) === -1;
        });
      });

      var isDeceased = people.some(function (person) {
        return !!person.died;
      });

      var title = people.map(function (person) {
        var href = personHref(person);
        if (!href) {
          return formatName(person);
        }
        return '<a href="' + href + '" target="_blank" rel="noopener noreferrer">' + formatName(person) + '</a>';
      }).join(' &amp; ');

      var meta = [];
      if (primary && primary.born) {
        meta.push('b. ' + primary.born);
      }
      if (primary && primary.married && people.length > 1) {
        meta.push('m. ' + primary.married);
      }
      if (primary && primary.died) {
        meta.push('d. ' + primary.died);
      }

      var flag = '';
      var names = people.map(function (person) { return person.name; }).join(' ');
      if (/Australia/.test(names)) {
        flag = '🇦🇺';
      } else if (/Israel/.test(names)) {
        flag = '🇮🇱';
      } else if (/Staten Island/.test(names)) {
        flag = '🇺🇸';
      }

      return {
        title: title,
        meta: meta,
        linked: isLinked,
        deceased: isDeceased,
        flag: flag,
        href: people.length === 1 ? personHref(people[0]) : '',
      };
    }

    function buildCoupleTree(personIds, seen) {
      var dedupeKey = personIds.slice().sort(function (a, b) { return a - b; }).join('-');
      if (seen.has(dedupeKey)) {
        return null;
      }
      seen.add(dedupeKey);

      var childIds = uniqueChildrenForPeople(personIds);
      var children = childIds.map(function (childId) {
        var child = nodesById.get(childId);
        if (!child) {
          return null;
        }

        var coupleIds = [child.id];
        spouseIds(child).forEach(function (pid) {
          if (coupleIds.indexOf(pid) === -1) {
            coupleIds.push(pid);
          }
        });

        return buildCoupleTree(coupleIds, seen);
      }).filter(Boolean);

      return {
        key: dedupeKey,
        people: personIds,
        children: children,
      };
    }

    function findTreeNode(treeNode, key) {
      if (!treeNode) {
        return null;
      }
      if (treeNode.key === key) {
        return treeNode;
      }
      for (var i = 0; i < (treeNode.children || []).length; i++) {
        var found = findTreeNode(treeNode.children[i], key);
        if (found) {
          return found;
        }
      }
      return null;
    }

    function focusTreeNode(treeNode) {
      if (!treeNode || !treeNode.children || !treeNode.children.length) {
        return;
      }
      focusHistory.push(currentFocusKey);
      currentFocusKey = treeNode.key;
      updateViewer();
    }

    function renderNode(treeNode) {
      var li = document.createElement('li');
      var cardData = nodeCardData(treeNode.people);
      var card = document.createElement('div');
      card.className = 'node-card' +
        (cardData.linked ? ' linked' : '') +
        (cardData.deceased ? ' deceased' : '');
      card.addEventListener('click', function () {
        focusTreeNode(treeNode);
      });

      var name = document.createElement('div');
      name.className = 'node-name';
      name.innerHTML = cardData.title;
      card.appendChild(name);

      if (cardData.href) {
        var info = document.createElement('a');
        info.className = 'node-info';
        info.href = cardData.href;
        info.target = '_blank';
        info.rel = 'noopener noreferrer';
        info.textContent = 'i';
        info.title = 'Open detail page';
        info.setAttribute('aria-label', 'Open detail page');
        info.addEventListener('click', function (event) {
          event.stopPropagation();
        });
        card.appendChild(info);
      }

      if (cardData.meta.length) {
        var meta = document.createElement('div');
        meta.className = 'node-meta';
        meta.innerHTML = cardData.meta.map(function (item) {
          return '<span>' + item + '</span>';
        }).join('');
        card.appendChild(meta);
      }

      if (cardData.flag) {
        var flag = document.createElement('div');
        flag.className = 'node-flag';
        flag.textContent = cardData.flag;
        card.appendChild(flag);
      }

      li.appendChild(card);

      if (treeNode.children && treeNode.children.length) {
        var ul = document.createElement('ul');
        treeNode.children.forEach(function (child) {
          ul.appendChild(renderNode(child));
        });
        li.appendChild(ul);
      }

      return li;
    }

    function renderTree(branch) {
      treeRootEl.innerHTML = '';

      if (!branch) {
        treeRootEl.innerHTML = '<div class="empty">No branch selected.</div>';
        return;
      }

      var roots = branch.useAllRoots
        ? majorRoots.map(function (item) {
            return buildCoupleTree(item.people.slice(), new Set());
          }).filter(Boolean)
        : [buildCoupleTree(branch.people.slice(), new Set())].filter(Boolean);

      if (!roots.length) {
        treeRootEl.innerHTML = '<div class="empty">This branch could not be rendered.</div>';
        return;
      }

      if (currentFocusKey) {
        var focused = null;
        roots.some(function (candidate) {
          focused = findTreeNode(candidate, currentFocusKey);
          return !!focused;
        });

        if (focused) {
          roots = [focused];
        } else {
          currentFocusKey = null;
          focusHistory = [];
        }
      }

      roots.forEach(function (rootTree) {
        var tree = document.createElement('ul');
        tree.className = 'tree';
        tree.appendChild(renderNode(rootTree));
        treeRootEl.appendChild(tree);
      });
      applyZoom();
    }

    function renderBranchList(filterText) {
      var filter = (filterText || '').trim().toLowerCase();
      branchListEl.innerHTML = '';

      [allBranch].concat(majorRoots).forEach(function (branch) {
        var haystack = (branch.label + ' ' + branch.description).toLowerCase();
        if (filter && haystack.indexOf(filter) === -1) {
          return;
        }

        var button = document.createElement('button');
        button.type = 'button';
        button.className = 'branch-button' + (branch.id === activeBranchId ? ' active' : '');
        button.addEventListener('click', function () {
          activeBranchId = branch.id;
          currentFocusKey = null;
          focusHistory = [];
          updateViewer();
        });

        var title = document.createElement('div');
        title.className = 'branch-button-title';
        title.textContent = branch.label;

        var meta = document.createElement('div');
        meta.className = 'branch-button-meta';
        meta.textContent = branch.description;

        button.appendChild(title);
        button.appendChild(meta);
        branchListEl.appendChild(button);
      });
    }

    function activeBranch() {
      return [allBranch].concat(majorRoots).find(function (branch) {
        return branch.id === activeBranchId;
      }) || null;
    }

    function updateViewer() {
      var branch = activeBranch();
      renderBranchList(branchSearchEl.value);

      if (!branch) {
        viewerTitleEl.textContent = 'Select a branch';
        viewerDescriptionEl.textContent = 'Choose one of the major roots above to focus the tree.';
        backOutEl.hidden = true;
        renderTree(null);
        return;
      }

      var focusedTree = currentFocusKey ? findTreeNode(buildCoupleTree(branch.people.slice(), new Set()), currentFocusKey) : null;
      if (focusedTree) {
        viewerTitleEl.textContent = nodeCardData(focusedTree.people).title.replace(/<[^>]+>/g, '');
        viewerDescriptionEl.textContent = 'Showing descendants from this selected person or couple within the ' + branch.label + ' branch.';
        backOutEl.hidden = false;
      } else {
        viewerTitleEl.textContent = branch.label;
        viewerDescriptionEl.textContent = branch.description + '. Click a card to focus on that subtree.';
        backOutEl.hidden = true;
      }
      renderTree(branch);
    }

    function applyZoom() {
      treeStageEl.style.transform = 'scale(' + currentZoom + ')';
      zoomResetEl.textContent = Math.round(currentZoom * 100) + '%';
    }

    document.getElementById('zoom-in').addEventListener('click', function () {
      currentZoom = Math.min(1.6, currentZoom + 0.1);
      applyZoom();
    });

    document.getElementById('zoom-out').addEventListener('click', function () {
      currentZoom = Math.max(0.45, currentZoom - 0.1);
      applyZoom();
    });

    zoomResetEl.addEventListener('click', function () {
      currentZoom = 1;
      applyZoom();
    });

    backOutEl.addEventListener('click', function () {
      currentFocusKey = focusHistory.length ? focusHistory.pop() : null;
      updateViewer();
    });

    branchSearchEl.addEventListener('input', function () {
      renderBranchList(branchSearchEl.value);
    });

    updateViewer();
  </script>
</body>
</html>
