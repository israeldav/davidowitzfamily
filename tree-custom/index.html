<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Davidowitz & Herskowitz Family Tree</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oxygen:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --page-bg: #f9f9f9;
      --panel-bg: #ffffff;
      --card-bg: #ffffff;
      --card-border: #999999;
      --card-link-border: #66ccff;
      --card-shadow: 2px 2px 6px rgba(0, 0, 0, 0.1);
      --text: #222222;
      --muted: #666666;
      --line: #b8b8b8;
      --link: #1458b8;
      --badge-bg: #eef4ff;
      --badge-text: #174b8a;
      --badge-muted-bg: #f0f0f0;
      --badge-muted-text: #666666;
      --tree-gap-y: 42px;
      --tree-gap-x: 18px;
      --card-width: 228px;
      --card-radius: 4px;
      --zoom-min: 0.28;
      --zoom-max: 1.5;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: var(--page-bg);
      color: var(--text);
      font-family: "Oxygen", sans-serif;
    }

    body {
      min-height: 100vh;
    }

    .page {
      padding: 10px 12px 24px;
    }

    h1 {
      margin: 0 0 14px;
      text-align: center;
      font-size: 28px;
      line-height: 1.2;
      font-weight: 700;
    }

    .tree-shell {
      width: 100%;
      padding: 12px 12px 28px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.95), rgba(244, 246, 249, 0.98));
      border-radius: 10px;
    }

    .tree-toolbar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin: 0 0 12px;
      flex-wrap: wrap;
    }

    .tree-zoom-button,
    .tree-fit-button {
      height: 32px;
      min-width: 32px;
      border: 1px solid #ccd2da;
      border-radius: 999px;
      background: #ffffff;
      color: #334155;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      padding: 0 12px;
      transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease;
    }

    .tree-zoom-button {
      padding: 0;
    }

    .tree-zoom-button:hover,
    .tree-fit-button:hover {
      background: #f4f7fb;
      border-color: #99b8e6;
      color: #1458b8;
    }

    .tree-zoom-readout {
      min-width: 48px;
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      font-weight: 700;
    }

    .tree-viewport {
      overflow: auto;
      width: 100%;
    }

    .tree-scale-stage {
      width: max-content;
      min-width: 100%;
      margin: 0 auto;
      transform-origin: top center;
    }

    .tree-root-row {
      min-width: max-content;
      display: flex;
      gap: 56px;
      justify-content: center;
      align-items: flex-start;
      padding: 4px 4px 10px;
      transform-origin: top center;
    }

    .tree,
    .tree ul {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .tree {
      display: inline-block;
    }

    .tree ul {
      display: flex;
      justify-content: center;
      padding-top: var(--tree-gap-y);
      position: relative;
    }

    .tree li {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      min-width: var(--card-width);
      padding: 0 calc(var(--tree-gap-x) / 2);
    }

    .tree ul::before {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      width: 0;
      height: 22px;
      border-left: 1px solid var(--line);
      transform: translateX(-0.5px);
    }

    .tree li::before,
    .tree li::after {
      content: "";
      position: absolute;
      top: 0;
      width: 50%;
      height: 22px;
      border-top: 1px solid var(--line);
    }

    .tree li::before {
      right: 50%;
    }

    .tree li::after {
      left: 50%;
      border-left: 1px solid var(--line);
    }

    .tree li:only-child::before,
    .tree li:only-child::after {
      display: none;
    }

    .tree li:first-child::before,
    .tree li:last-child::after {
      border-top: none;
    }

    .tree li:last-child::before {
      border-right: 1px solid var(--line);
      border-radius: 0 8px 0 0;
    }

    .tree li:first-child::after {
      border-radius: 8px 0 0 0;
    }

    .tree-node {
      width: var(--card-width);
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--card-radius);
      box-shadow: var(--card-shadow);
      padding: 34px 10px 7px;
      position: relative;
      z-index: 1;
    }

    .tree-node.linked {
      border: 2px solid var(--card-link-border);
    }

    .tree-focus-toggle {
      position: absolute;
      top: 7px;
      right: 7px;
      width: 20px;
      height: 20px;
      border: 1px solid #c4c7cc;
      border-radius: 999px;
      background: #ffffff;
      color: #4b5563;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease;
    }

    .tree-focus-toggle:hover {
      background: #f4f7fb;
      border-color: #99b8e6;
      color: #1458b8;
    }

    .tree-focus-toggle.active {
      background: #1458b8;
      border-color: #1458b8;
      color: #ffffff;
    }

    .tree-focus-toggle svg {
      width: 12px;
      height: 12px;
      display: block;
    }

    .tree-line {
      font-size: 14px;
      line-height: 1.3;
      white-space: normal;
      overflow-wrap: anywhere;
    }

    .tree-line + .tree-line {
      margin-top: 4px;
    }

    .tree-line a {
      color: var(--link);
      text-decoration: none;
      font-weight: 700;
    }

    .tree-line a:hover {
      text-decoration: underline;
    }

    .tree-note {
      margin-top: 5px;
      font-size: 11px;
      line-height: 1.2;
      color: var(--muted);
    }

    .tree-badges {
      margin-top: 6px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 4px;
    }

    .tree-badge {
      font-size: 10px;
      line-height: 1;
      border-radius: 999px;
      padding: 4px 6px;
      font-weight: 700;
      letter-spacing: 0.02em;
      background: var(--badge-bg);
      color: var(--badge-text);
    }

    .tree-badge.muted {
      background: var(--badge-muted-bg);
      color: var(--badge-muted-text);
    }

    .tree-status {
      text-align: center;
      font-size: 13px;
      line-height: 1.4;
      color: var(--muted);
      margin: -2px 0 12px;
    }

    @media (max-width: 900px) {
      .page {
        padding: 8px 6px 16px;
      }

      h1 {
        font-size: 24px;
        margin-bottom: 10px;
      }

      .tree-shell {
        padding: 8px 8px 20px;
      }

      .tree-root-row {
        gap: 32px;
      }

      .tree-toolbar {
        gap: 8px;
      }
    }
  </style>
</head>
<body>

    var nextNodeId = 1;
    var nodeLookup = {};

    function assignNodeIds(nodes) {
      nodes.forEach(function (node) {
        node.id = node.id || 'node-' + nextNodeId++;
        nodeLookup[node.id] = node;

        if (node.children && node.children.length) {
          assignNodeIds(node.children);
        }
      });
    }

    assignNodeIds(treeData);

    function focusIconSvg() {
      return '' +
        '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">' +
          '<path fill="currentColor" d="M10 4a6 6 0 1 0 3.87 10.58l4.27 4.27 1.41-1.41-4.27-4.27A6 6 0 0 0 10 4zm0 2a4 4 0 1 1 0 8 4 4 0 0 1 0-8zm-.75 1.25h1.5v2h2v1.5h-2v2h-1.5v-2h-2v-1.5h2v-2z"></path>' +
        '</svg>';
    }

    function clampZoom(value) {
      return Math.max(0.28, Math.min(1.5, value));
    }

    function updateZoomDisplay() {
      zoomReadoutEl.textContent = Math.round(currentZoom * 100) + '%';
    }

    function applyZoom() {
      treeRootEl.style.transform = 'scale(' + currentZoom + ')';
      treeScaleStageEl.style.width = Math.max(treeViewportEl.clientWidth, treeRootEl.scrollWidth * currentZoom) + 'px';
      treeScaleStageEl.style.height = Math.max(treeRootEl.scrollHeight * currentZoom, 40) + 'px';
      updateZoomDisplay();
    }

    function setZoom(value) {
      currentZoom = clampZoom(value);
      applyZoom();
    }

    function fitTreeToViewport() {
      var previousTransform = treeRootEl.style.transform;
      treeRootEl.style.transform = 'scale(1)';
      var fullWidth = treeRootEl.scrollWidth;
      var viewportWidth = treeViewportEl.clientWidth - 16;
      treeRootEl.style.transform = previousTransform;

      if (!fullWidth || !viewportWidth) {
        setZoom(1);
        return;
      }

      setZoom(Math.min(1, viewportWidth / fullWidth));
      treeViewportEl.scrollLeft = 0;
      treeViewportEl.scrollTop = 0;
    }

    function toggleFocus(nodeId) {
      currentFocusId = currentFocusId === nodeId ? null : nodeId;
      renderCurrentTree();
    }

    function getVisibleForest() {
      if (!currentFocusId) {
        return treeData;
      }

      return nodeLookup[currentFocusId] ? [nodeLookup[currentFocusId]] : treeData;
    }

    function updateStatus() {
      if (!currentFocusId || !nodeLookup[currentFocusId]) {
        treeStatusEl.textContent = 'Showing the full family tree.';
        return;
      }

      var focusedNode = nodeLookup[currentFocusId];
      var label = focusedNode.focusLabel || stripHtml((focusedNode.lines || []).join(' '));
      treeStatusEl.textContent = 'Showing only the branch for ' + label + '. Click the same icon again to return to the full tree.';
    }

    function stripHtml(value) {
      var temp = document.createElement('div');
      temp.innerHTML = value;
      return temp.textContent.replace(/\s+/g, ' ').trim();
    }

    function createNodeCard(node) {
      var card = document.createElement('div');
      card.className = 'tree-node' + (node.linked ? ' linked' : '');

      var focusToggle = document.createElement('button');
      focusToggle.type = 'button';
      focusToggle.className = 'tree-focus-toggle' + (currentFocusId === node.id ? ' active' : '');
      focusToggle.setAttribute('aria-label', currentFocusId === node.id ? 'Show the full family tree' : 'Show only this branch');
      focusToggle.title = currentFocusId === node.id ? 'Return to the full family tree' : 'Show only this branch';
      focusToggle.innerHTML = focusIconSvg();
      focusToggle.addEventListener('click', function (event) {
        event.preventDefault();
        event.stopPropagation();
        toggleFocus(node.id);
      });
      card.appendChild(focusToggle);

      (node.lines || []).forEach(function (line) {
        var lineEl = document.createElement('div');
        lineEl.className = 'tree-line';
        lineEl.innerHTML = line;
        card.appendChild(lineEl);
      });

      if (node.note) {
        var noteEl = document.createElement('div');
        noteEl.className = 'tree-note';
        noteEl.textContent = node.note;
        card.appendChild(noteEl);
      }

      if (node.badges && node.badges.length) {
        var badgeWrap = document.createElement('div');
        badgeWrap.className = 'tree-badges';
        node.badges.forEach(function (badgeHtml) {
          var holder = document.createElement('div');
          holder.innerHTML = badgeHtml;
          badgeWrap.appendChild(holder.firstChild);
        });
        card.appendChild(badgeWrap);
      }

      return card;
    }

    function renderTree(node) {
      var li = document.createElement('li');
      li.appendChild(createNodeCard(node));

      if (node.children && node.children.length) {
        var childList = document.createElement('ul');
        node.children.forEach(function (child) {
          childList.appendChild(renderTree(child));
        });
        li.appendChild(childList);
      }

      return li;
    }

    function renderForest(forest, container) {
      container.innerHTML = '';

      forest.forEach(function (rootNode) {
        var tree = document.createElement('ul');
        tree.className = 'tree';
        tree.appendChild(renderTree(rootNode));
        container.appendChild(tree);
      });
    }

    function renderCurrentTree() {
      renderForest(getVisibleForest(), treeRootEl);
      updateStatus();
      fitTreeToViewport();
    }

    zoomOutEl.addEventListener('click', function () {
      setZoom(currentZoom - 0.12);
    });

    zoomInEl.addEventListener('click', function () {
      setZoom(currentZoom + 0.12);
    });

    zoomFitEl.addEventListener('click', function () {
      fitTreeToViewport();
    });

    window.addEventListener('resize', function () {
      applyZoom();
    });

    renderCurrentTree();
  </script>
</body>
</html>
